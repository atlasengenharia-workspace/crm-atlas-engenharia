name: .NET CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/frontend/frontend/frontend.csproj

    - name: Build
      run: dotnet build src/frontend/frontend/frontend.csproj --no-restore --configuration Release

    - name: Test Unit
      run: dotnet test tests/UnitTests/UnitTests.csproj --verbosity normal

    - name: Test Integration
      run: dotnet test tests/IntegrationTests/IntegrationTests.csproj --verbosity normal

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Railway CLI
      run: npm i -g @railway/cli

    - name: Deploy to Railway
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        railway up \
          --project d0cae88a-42a2-42e0-ba83-ff24d5af1064 \
          --service 77852547-c653-43f9-8589-821640630cbd \
          --environment 9437cb3b-facf-42b0-869f-a33f12bcb7e6 \
          --detach \
          --yes
